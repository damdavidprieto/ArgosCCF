name: Publish to PowerShell Gallery

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish Module
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Dependencies
      shell: pwsh
      run: |
        Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser
        Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser
    
    - name: Run Tests
      shell: pwsh
      run: |
        .\build.ps1
    
    - name: Validate Module
      shell: pwsh
      run: |
        Test-ModuleManifest -Path .\ArgosCCF.psd1
        Import-Module .\ArgosCCF.psd1 -Force
        $commands = Get-Command -Module ArgosCCF
        Write-Host "Module exports $($commands.Count) functions"
    
    - name: Publish to PowerShell Gallery
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if (-not $env:NUGET_API_KEY) {
          Write-Warning "NUGET_API_KEY not set - skipping publish"
          exit 0
        }
        Publish-Module -Path . -NuGetApiKey $env:NUGET_API_KEY -Verbose
    
    - name: Create GitHub Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" --title "ArgosCCF ${{ github.ref_name }}" --notes "See CHANGELOG.md for details: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md"
